name: Update WNBA Live Refresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node generate.js

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add feed.xml
          git commit -m "Refresh scoreboard" || exit 0
          git push
